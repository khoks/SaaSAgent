# SaaSAgent platform — local development infrastructure (Phase 0).
#
# Per ADR-008 (memory) + ADR-014 (Redpanda) + ADR-026 (Compose for dev/demo) +
# ADR-032 (full polyglot stack from MVP).
#
#   pnpm infra:up      # start all services
#   pnpm infra:down    # stop (preserves data)
#   pnpm infra:logs    # tail logs
#   pnpm infra:reset   # stop and DROP DATA

services:
  postgres:
    image: postgres:16-alpine
    container_name: saasagent-postgres
    environment:
      POSTGRES_USER: saasagent
      POSTGRES_PASSWORD: saasagent
      POSTGRES_DB: saasagent
    ports:
      - "5432:5432"
    volumes:
      - saasagent-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saasagent"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: saasagent-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - saasagent-qdrant-data:/qdrant/storage

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: saasagent-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - saasagent-redpanda-data:/var/lib/redpanda/data

  # ClickHouse — pulled forward to MVP per ADR-032.
  # Hosts: time-tiered summaries, eval datapoints, agent telemetry, VoC analytics, per-user usage tallying.
  clickhouse:
    image: clickhouse/clickhouse-server:24.10-alpine
    container_name: saasagent-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - saasagent-ch-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Neo4j — pulled forward to MVP per ADR-032.
  # Hosts: intra-tenant problem-solution graph, churn-similar-customer relations, VoC graph.
  neo4j:
    image: neo4j:5.25-community
    container_name: saasagent-neo4j
    environment:
      NEO4J_AUTH: neo4j/saasagent_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - saasagent-neo4j-data:/data

volumes:
  saasagent-pg-data:
  saasagent-qdrant-data:
  saasagent-redpanda-data:
  saasagent-ch-data:
  saasagent-neo4j-data:
