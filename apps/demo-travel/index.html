<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SaaSAgent — Travel demo</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fa;
        --card-bg: #ffffff;
        --border: #d1d5db;
        --muted: #6b7280;
        --text: #111827;
        --accent: #2563eb;
        --success: #16a34a;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
      .brand { font-weight: 700; font-size: 16px; }
      .layout { display: grid; grid-template-columns: 1fr 420px; gap: 24px; max-width: 1280px; margin: 0 auto; padding: 24px; }
      main { background: var(--card-bg); padding: 24px; border-radius: 8px; border: 1px solid var(--border); }
      .search-bar { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px; margin-bottom: 24px; }
      .search-bar input, .search-bar button { padding: 10px; font-size: 14px; }
      .search-bar input { border: 1px solid var(--border); border-radius: 4px; }
      .search-bar button { background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer; }
      .flights { display: flex; flex-direction: column; gap: 12px; }
      .flight { border: 1px solid var(--border); border-radius: 6px; padding: 16px; display: grid; grid-template-columns: 1fr 1fr 1fr auto; align-items: center; gap: 16px; }
      .flight .route { font-weight: 600; }
      .flight .stops { font-size: 13px; color: var(--muted); }
      .flight .price { color: var(--success); font-weight: 600; font-variant-numeric: tabular-nums; }
      .flight button { padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer; }
      aside { position: sticky; top: 24px; align-self: start; }
      aside saas-agent { display: block; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; min-height: 360px; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">FlyAgent — travel demo</div>
      <div style="font-size: 13px; color: var(--muted);" data-saas-agent-observe="search-summary">Search: SFO → NRT</div>
    </header>

    <div class="layout">
      <main>
        <div class="search-bar" data-saas-agent-observe="search-form">
          <input id="from" value="SFO" placeholder="From">
          <input id="to" value="NRT" placeholder="To">
          <input id="when" value="2026-08-15" placeholder="Depart">
          <button id="search">Search</button>
        </div>

        <h2 style="margin: 0 0 12px;">Results</h2>
        <div class="flights" data-saas-agent-observe="flight-results" id="flight-results"></div>
      </main>

      <aside data-saas-agent-track-viewport="agent-panel">
        <saas-agent runtime="http://localhost:8080" mode="side-panel"></saas-agent>
      </aside>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
