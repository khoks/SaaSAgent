<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SaaSAgent — E-commerce demo</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fa;
        --card-bg: #ffffff;
        --border: #d1d5db;
        --muted: #6b7280;
        --text: #111827;
        --accent: #2563eb;
        --success: #16a34a;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
      header .brand { font-weight: 700; font-size: 16px; }
      header .cart-summary { font-size: 13px; color: var(--muted); }
      .layout { display: grid; grid-template-columns: 1fr 420px; gap: 24px; max-width: 1280px; margin: 0 auto; padding: 24px; }
      main { background: var(--card-bg); padding: 24px; border-radius: 8px; border: 1px solid var(--border); }
      h1 { margin: 0 0 16px; font-size: 22px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
      .product { border: 1px solid var(--border); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
      .product .name { font-weight: 600; }
      .product .price { color: var(--success); font-variant-numeric: tabular-nums; }
      .product button { padding: 8px 12px; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer; }
      .product button:hover { background: #1d4ed8; }
      .cart { margin-top: 24px; border-top: 1px solid var(--border); padding-top: 16px; }
      .cart h2 { margin: 0 0 8px; font-size: 16px; }
      .cart-items { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--muted); }
      aside { position: sticky; top: 24px; align-self: start; }
      aside saas-agent { display: block; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; min-height: 360px; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">ShopAgent — e-commerce demo</div>
      <div class="cart-summary" data-saas-agent-observe="cart-summary">Cart: 0 items, $0.00</div>
    </header>

    <div class="layout">
      <main>
        <h1>Featured TVs</h1>
        <div class="grid" data-saas-agent-observe="product-grid" id="product-grid"></div>

        <div class="cart" data-saas-agent-observe="cart">
          <h2>Your cart</h2>
          <div class="cart-items" id="cart-items">empty</div>
        </div>
      </main>

      <aside data-saas-agent-track-viewport="agent-panel">
        <saas-agent runtime="http://localhost:8080" mode="side-panel"></saas-agent>
      </aside>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
